<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Job Market Analyzer">
    <title>Job Market Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Job Market Analyzer</h1>
    <p>Find internships based on your skills.</p>
    <main>
        <h2> Your preferences </h2>
        <form action="/hippo" method="post">
            <label for="skills"> Your skills:</label>
            <input type="text" id="skills" name="skills">
            <label for="locations"> Preferred locations:</label>
            <input type="text" id="locations" name="locations">
            <label for="minimum_salary"> Minimum Salary:</label>
            <input type="number" id="minimum_salary" name="minimum_salary" min="0">
            <label for="workplace_type"> Workplace Type: </label>
            <select id="workplace_type" name="workplace_type">
                <option value=""> Choose an option </option>
                <option value="hybrid"> Hybrid </option>
                <option value="remote"> Remote </option>
                <option value="onsite"> Onsite </option>
            </select>
            <label for="experience_level"> Experience Level</label>
            <select id="experience_level" name="experience_level">
                <option value=""> Choose an option </option>
                <option value="entry"> Entry </option>
                <option value="junior"> Junior </option>
                <option value="intermediate"> Intermediate </option>
                <option value="senior"> Senior </option>
            </select>
            <label for="employment_type">Employment Type:</label>
            <select id="employment_type" name="employment_type" required>
                <option value="" selected disabled>Choose an option</option>
                <option value="internship">Internship</option>
                <option value="full_time">Full-time</option>
                <option value="part_time">Part-time</option>
            </select>

            <button type="submit">Submit</button>

        </form>
    </main>
</body>
</html>
